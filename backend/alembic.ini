# Alembic 配置：CLI 使用（应用启动时由 app/models/database.py 程序化调用，URL 运行时注入）
[alembic]
script_location = alembic
# 连接串占位：实际由环境变量 DATABASE_URL 覆盖（见 alembic/env.py），
# 禁止在此提交真实密码
sqlalchemy.url = mysql+pymysql://root@127.0.0.1:3306/codewise

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
