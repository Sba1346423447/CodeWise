# CodeWise 前端生产环境 Nginx 配置：静态文件服务 + API 反向代理
server {
    listen 80;
    server_name _;

    # 前端构建产物（Vite dist/ 挂载到容器内）
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（add_header 在 location 级需重复声明才生效，故统一放 server 级）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip 压缩：文本类资源显著减小体积
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # SPA 路由回退：非文件请求统一返回 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源：长期缓存（文件名变化即新资源）
    # 本 location 含 add_header，不继承 server 级安全头，需在此重复声明
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API 反向代理到后端服务（docker-compose 内服务名 backend:8000）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应关键配置：关闭缓冲、取消缓存、延长读取超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
