# CodeWise 主配置：集中管理可调优参数，非代码人员可直接修改本文件

# ===== LLM 调用配置 =====
llm:
  # 模型名称（须与 .env 中 LLM_MODEL 保持一致，.env 优先级更高）
  model: "deepseek-v4-flash-ga-260731"
  # 轻量模型：审查分类/测试生成/反思/总结等受控输出角色使用（省推理时间）。
  # 留空回落主模型（行为兼容）。
  # 注意：doubao-seed 系为混合推理模型，轻量角色实测比主模型更慢，勿配（实测数据见 docs/工作记录）
  fast_model: ""
  # 采样温度：越低越稳定，越高越有创造力
  temperature: 0
  # 单次生成的最大 token 数：推理模型会先长推理再给答案，预算必须充足。
  # 4096 保证复杂任务（ReAct 循环、完整模块）的推理+代码不被截断。
  # 注意：初期以稳定性优先，不因省 token 压缩该值；后续可针对性优化
  max_tokens: 4096

# ===== Agent 编排配置 =====
agent:
  # 最大反思轮次：Reflect → Refine 循环的上限，超出后强制输出当前结果。
  # 2 轮给"审查→修正"留出一次纠错机会，提高成功率（稳定性优先）
  max_reflection_rounds: 2

# ===== 沙箱执行配置 =====
sandbox:
  # 沙箱工作目录：留空则使用系统临时目录（与 .env SANDBOX_DIR 对应）
  workdir: ""
  # 代码执行超时时间（秒）
  timeout: 30

# ===== 代码库感知配置（repo-map） =====
repo_map:
  # 项目根目录：扫描该目录下的 .py 文件生成结构摘要；留空表示禁用
  root: "D:/databox/backend"
  # 摘要最大字符数：控制注入 token 预算
  max_chars: 2000

# ===== 安全审查配置（四层审查链路） =====
security:
  # 总开关：关闭后工具调用直接执行（等价于审查链路加入前的行为）
  enabled: true
  # 第一层·规则过滤：拦截级危险代码模式（命令执行，命中即拦截，
  # 作用于 code_executor/test_runner 的 code 参数与代码主链路）。
  # 注：eval/exec/__import__ 已降为确认级——current_code 本就会被真实执行，
  # 动态执行无独立风险增量，硬拦截反致 ReAct 类任务（动态分发为核心机制）交付走样
  dangerous_code_patterns:
    - "os.system"
    - "os.popen"
    - "subprocess."
    - "shutil.rmtree"
  # 第一层·规则过滤：确认级代码模式（网络外联/动态执行，可能有正当用途——
  # 如用户明确要求发 HTTP 请求、ReAct 框架的工具动态分发——命中后挂起
  # 等人工确认，而非静默拦截）
  confirm_code_patterns:
    - "socket."
    - "requests."
    - "urllib."
    - "eval("
    - "exec("
    - "__import__("
  # 第一层·规则过滤：敏感路径模式（作用于 file_editor 的 path 参数，防密钥/凭据文件读写）
  sensitive_path_patterns:
    - ".env"
    - ".pem"
    - ".key"
    - "id_rsa"
    - "secret"
    - "credential"
    - "token"
  # 第三层·AI 风险分类：LLM 判别 prompt 注入 / 数据外泄 / 破坏性意图
  # LLM 调用失败时保守降级为"需人工确认"（宁可多问一次，不放行可疑操作）
  risk_classifier:
    enabled: true
