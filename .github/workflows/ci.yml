# CodeWise CI：push / PR 触发，后端 ruff + pytest(cov≥80%) + 前端 eslint/vitest/tsc/vite 构建
# 借鉴 Aider ubuntu-tests.yml 的最小起步策略：Python 单版本，不搞矩阵
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  backend:
    name: Backend (ruff + pytest + MySQL)
    runs-on: ubuntu-latest
    # 集成测试依赖真实 MySQL（models 层裸 SQL 走真实方言执行）
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: codewise
          MYSQL_DATABASE: codewise_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pcodewise --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # conftest.py 读取 TEST_DATABASE_URL 覆盖 DATABASE_URL，指向 service 容器测试库
      TEST_DATABASE_URL: mysql+aiomysql://root:codewise@127.0.0.1:3306/codewise_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Test with pytest
        working-directory: backend
        run: pytest -q --cov=app

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
