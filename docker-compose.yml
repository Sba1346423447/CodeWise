# CodeWise 五服务编排：nginx（网关）+ frontend（静态） + backend（API）+ mysql（会话持久化）+ chromadb（向量库）
services:
  # ===== 后端：FastAPI + LangGraph =====
  backend:
    build: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      # 轻量模型（审查/测试生成/反思/总结角色；留空回落 LLM_MODEL）
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # API 鉴权与限流（留空关闭鉴权，仅限本地开发）
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_TIMES: ${RATE_LIMIT_TIMES:-10}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      # 连接 compose 内的独立 ChromaDB 服务（容器服务名）
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # 连接 compose 内 MySQL 服务（专用账号，非 root）
      DATABASE_URL: mysql+aiomysql://codewise:${MYSQL_PASSWORD:-codewise}@mysql:3306/codewise
    volumes:
      # 根目录 config/ 挂载到容器根 /config：代码以 parents[3/4] 解析到容器根 /config，
      # 若不挂载则 prompts.yaml/settings.yaml 全部丢失（提示词模板、反思轮次等配置）
      - ./config:/config:ro
      # 运行/审计日志持久化（audit_*.log 安全回溯依赖，容器重建不丢）
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    # 资源限制：防单服务异常拖垮宿主机
    mem_limit: 2g
    cpus: 2.0

  # ===== 前端：Vite 构建产物（内部 nginx 提供静态文件） =====
  frontend:
    build: ./frontend
    # 构建产物输出到共享卷，供网关 nginx 挂载
    volumes:
      - frontend-dist:/usr/share/nginx/html
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== 数据库：MySQL 会话/消息/步骤持久化 =====
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-codewise}
      MYSQL_DATABASE: codewise
      # 应用专用账号（backend 通过 DATABASE_URL 使用，非 root 连接）
      MYSQL_USER: codewise
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codewise}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===== 向量库：ChromaDB 独立服务 =====
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      # 镜像不保证带 curl，用必有的 python3 探活
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===== 网关：Nginx 对外入口（静态 + /api 反向代理 + SSE） =====
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:       # MySQL 数据持久化
  chroma-data:      # ChromaDB 独立服务数据
  frontend-dist:    # 前端构建产物共享卷
  backend-logs:     # 后端运行/审计日志持久化
